<div class="layout" [class.sidebar-collapsed]="!sidebarOpen()" [class.mobile-open]="mobileNav()">
  <!-- Mobile backdrop -->
  <div class="mobile-backdrop" (click)="closeMobile()"></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <i class="bi bi-capsule-pill brand-icon"></i>
      <span class="brand-text">Pharmacy Suite</span>
    </div>

    <nav class="sidebar-nav">
      @for (item of visibleNav(); track item.label) {
        @if (item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            class="nav-item"
            [title]="item.label"
            (click)="closeMobile()"
          >
            <i class="bi" [ngClass]="item.icon"></i>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        } @else {
          <span class="nav-item disabled" [title]="item.label + ' (coming soon)'">
            <i class="bi" [ngClass]="item.icon"></i>
            <span class="nav-label">{{ item.label }}</span>
            @if (item.comingSoon) {
              <span class="badge-soon">soon</span>
            }
          </span>
        }
      }
    </nav>

    <div class="sidebar-footer">
      <span class="nav-label small text-white-50">v0.1 · Phase 1</span>
    </div>
  </aside>

  <!-- Main column -->
  <div class="main-column">
    <header class="topbar">
      <button class="btn btn-light btn-sm toggle-btn" (click)="toggleSidebar()">
        <i class="bi bi-list"></i>
      </button>

      <div class="topbar-title d-none d-md-block">
        <span class="text-secondary small">Welcome back,</span>
        <span class="fw-semibold ms-1">{{ user()?.name }}</span>
      </div>

      <div class="topbar-actions">
        @if (canSell()) {
          <button class="btn btn-pharma btn-sm new-sale-btn" (click)="pos.show()" title="Open Sales POS">
            <i class="bi bi-bag-plus me-1"></i> <span class="d-none d-sm-inline">New Sale</span>
          </button>
        }
        <button class="btn btn-light btn-icon position-relative" title="Notifications">
          <i class="bi bi-bell"></i>
          <span class="notif-dot"></span>
        </button>

        <div class="dropdown">
          <button
            class="btn user-chip dropdown-toggle"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <span class="avatar">{{ initials() }}</span>
            <span class="user-meta d-none d-sm-flex">
              <span class="user-name">{{ user()?.name }}</span>
              <span class="user-role">{{ roleLabel() }}</span>
            </span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-pharma">
            <li><span class="dropdown-item-text small text-secondary">{{ user()?.email }}</span></li>
            <li><hr class="dropdown-divider" /></li>
            <li><button class="dropdown-item" disabled><i class="bi bi-person me-2"></i>Profile</button></li>
            <li><button class="dropdown-item text-danger" (click)="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
          </ul>
        </div>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>

  <!-- Global Sales POS popup (floats above the dashboard until closed) -->
  @if (pos.open()) {
    <div class="pos-overlay">
      <div class="pos-dialog">
        <div class="pos-dialog-head">
          <span class="pos-title"><i class="bi bi-bag-check me-2"></i>Sales · Point of Sale</span>
          <button class="pos-close" (click)="pos.hide()" title="Close (back to dashboard)">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <div class="pos-dialog-body">
          <app-billing />
        </div>
      </div>
    </div>
  }
</div>
