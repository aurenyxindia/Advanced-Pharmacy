<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Paperless Pharmacy">
  <defs>
    <linearGradient id="bg" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- bold medical cross — readable at 16px tab size -->
  <rect x="13" y="7" width="6" height="18" rx="1.2" fill="#ffffff"/>
  <rect x="7" y="13" width="18" height="6" rx="1.2" fill="#ffffff"/>
  <!-- brand accent -->
  <circle cx="24" cy="8" r="2.2" fill="#ef4444"/>
</svg>
